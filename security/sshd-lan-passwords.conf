# Passwords from the LAN only; a key logs in from anywhere. The admin
# account has passwordless sudo, so a password guessed from anywhere else
# would be root. The Match is last: it holds to the end of this file. The
# build fills in its addresses (SSHD_PASSWORD_ADDRESSES, sshd-password-addresses).
PasswordAuthentication no

Match Address @SSHD_PASSWORD_ADDRESSES@
	PasswordAuthentication yes
