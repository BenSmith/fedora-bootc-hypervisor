# Weekly runtime rung (B1), gate fidelity: the image this repository builds
# (registry.local/hypervisor-bootc:latest), turned into a bootable qcow2 by
# bootc-image-builder, booted with a swtpm-backed vTPM (B1b), and
# workloadctl's `runtime`-marked checks run against it
# (`WLRT_MODE=gate just test-runtime`).
#
# The harness and the checks are workloadctl's. They are checked out at the
# release this image pins (hypervisor.Containerfile's ARG WORKLOADCTL_VERSION,
# tag v<version>), so the image is held to the tests of the workloadctl it
# ships. Until that tag exists the run uses workloadctl's main, and warns.
#
# A CADENCE gate, not a PR gate: schedule + manual dispatch only. Forgejo
# only: it needs registry.local (homelab-internal) and privileged BIB, neither
# of which a GitHub-hosted runner can reach. The image is pulled FRESH into
# root's podman store each run, so it tests whatever the last image build
# published; gate self-skips green when swtpm is absent.
#
# The native runner lives inside the forgejo-runner VM, which exposes nested
# KVM (workloadctl launches it with `-cpu host`; verified live 2026-07-10) and
# whose cloud-init bakes the toolchain (qemu-kvm, swtpm, edk2-ovmf). The
# /dev/kvm probe below is a capability check, not a host list: any runner
# without KVM records a warning and exits green rather than failing. The
# runner takes two jobs at once and also runs workloadctl's own dev rung; each
# run's pre-flight sweep reaps only runs whose harness has gone.
#
# No secrets are used.
name: runtime-gate

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 11:00 UTC — after that day's image builds (07:00 minimal,
    # 09:00 hypervisor), so the image it boots is freshly built.
    - cron: '0 11 * * 2'

jobs:
  runtime-gate:
    runs-on: native
    # ~12min plus a BIB build on a cold cache.
    timeout-minutes: 120
    env:
      # Per-runner persistent cache, as an absolute path: the runner daemon runs
      # with no HOME in its environment, so "$HOME/wlrt-cache" resolved to the
      # filesystem root. Shared with workloadctl's dev rung.
      WLRT_CACHE: /var/cache/wlrt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: workloadctl at the image's pin
        id: pin
        env:
          REPO: ${{ github.server_url }}/${{ github.repository_owner }}/workloadctl.git
        run: |
          version=$(sed -n 's/^ARG WORKLOADCTL_VERSION=//p' hypervisor.Containerfile)
          if [ -z "$version" ]; then
            echo "::error::hypervisor.Containerfile has no ARG WORKLOADCTL_VERSION="
            exit 1
          fi
          if git ls-remote --exit-code --tags "$REPO" "refs/tags/v${version}" >/dev/null; then
            echo "ref=v${version}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::workloadctl has no tag v${version}; testing its main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout workloadctl
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/workloadctl
          ref: ${{ steps.pin.outputs.ref }}
          path: workloadctl

      - name: Check for /dev/kvm
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM present:"; ls -l /dev/kvm
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::/dev/kvm absent on this runner; skipping runtime rung."
          fi

      - name: Install runtime dependencies
        if: steps.kvm.outputs.available == 'true'
        run: |
          # Probe-then-install. Host-side binaries the harness needs
          # (workloadctl's tests/runtime/vmlaunch.py), plus swtpm for the
          # emulated vTPM the image boots with:
          #   qemu-system-x86_64  <- qemu-system-x86-core
          #   qemu-img            <- qemu-img
          #   cloud-localds       <- cloud-utils
          #   ssh-keygen          <- openssh (always present)
          declare -A need=(
            [qemu-system-x86_64]=qemu-system-x86-core
            [qemu-img]=qemu-img
            [cloud-localds]=cloud-utils
            [rsync]=rsync
            [pytest]=python3-pytest
            [just]=just
            [swtpm]=swtpm
          )
          missing=()
          for bin in "${!need[@]}"; do
            command -v "$bin" >/dev/null || missing+=("${need[$bin]}")
          done
          # OVMF has no binary to probe; the image boots UEFI-only.
          rpm -q edk2-ovmf >/dev/null || missing+=(edk2-ovmf)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo dnf install -y "${missing[@]}"
          fi
          just --version

      - name: Persistent image cache
        if: steps.kvm.outputs.available == 'true'
        working-directory: workloadctl
        run: |
          # The launcher caches the built gate qcow2 and the stable gate ssh
          # key under tests/runtime/.cache/. Point that at a per-runner
          # persistent dir so runs don't re-run BIB on a fresh workspace.
          mkdir -p "$WLRT_CACHE"
          rm -rf tests/runtime/.cache
          ln -s "$WLRT_CACHE" tests/runtime/.cache

      - name: Reap stale harness VMs
        if: steps.kvm.outputs.available == 'true'
        working-directory: workloadctl
        run: |
          # This runner is long-lived, so a cancelled run's QEMU survives it —
          # still running, still holding its scratch dir. Left alone they pile
          # up and starve the BIB build of disk. Sweep first; a no-op when
          # nothing is stale, and a run whose harness is alive is left alone.
          just reap-stale-runs
          df -h /var/tmp

      - name: Runtime rung (gate)
        if: steps.kvm.outputs.available == 'true'
        working-directory: workloadctl
        env:
          WLRT_MODE: gate
        run: just test-runtime
