# logrotate ships /var/lib/logrotate as an RPM payload directory, but bootc
# keeps /var empty in the image (it's machine-local state) and the build
# explicitly deletes it. logrotate ships no tmpfiles.d entry, so on a deployed
# host the state dir is absent and logrotate.service fails creating
# /var/lib/logrotate/logrotate.status (exit 3). Recreate it at boot.
d /var/lib/logrotate 0755 root root -
